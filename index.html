<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Penn &amp; Wharton First-Year Resource Hub</title>
<meta name="description" content="Links, deadlines, and how-tos for Penn and Wharton first-years: advising, clubs, study abroad, research, careers, wellness, and more." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 3h24v13c0 7-5 11-12 13C9 27 4 23 4 16z' fill='%23011F5B'/%3E%3Cpath d='M4 3h12v26C9 27 4 23 4 16z' fill='%23990000'/%3E%3C/svg%3E" />
<style>
  :root {
    --navy: #011F5B; --blue: #0C447C; --link: #185FA5; --link-dark: #0C447C;
    --tag: #D6E4F5; --tag-ink: #042C53; --red: #990000; --red-2: #B31B1B;
    --ink: #111; --soft: #555; --muted: #6b6b6b; --line: #e6e8eb; --shell: #f5f7fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: var(--ink); line-height: 1.45; }
  a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { color: var(--link-dark); }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 12px; top: -40px; background: var(--navy); color: #fff; padding: 8px 12px; z-index: 100; border-radius: 6px; }
  .skip:focus { top: 12px; color: #fff; }

  /* ---------- header ---------- */
  .top { text-align: center; padding: 30px 24px 22px; }
  .crest { width: 54px; height: 62px; display: block; margin: 0 auto 10px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin-bottom: 4px; }
  h1 { font-size: 30px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
  .subtitle { font-size: 17px; color: var(--soft); max-width: 660px; margin: 0 auto; }
  .stamp { font-size: 13px; color: var(--muted); margin-top: 8px; }

  /* ---------- sticky jump bar ---------- */
  .jump { position: sticky; top: 0; z-index: 30; background: var(--navy); border-top: 3px solid var(--red); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .jump-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .jump nav { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
  .jump nav::-webkit-scrollbar { display: none; }
  .jump nav a { color: #cfdcf0; text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap; padding: 13px 9px 11px; border-bottom: 3px solid transparent; }
  .jump nav a:hover { color: #fff; }
  .jump nav a.on { color: #fff; border-bottom-color: #fff; }
  .search { position: relative; flex: 0 0 220px; }
  .search input { width: 100%; font: inherit; font-size: 14px; padding: 7px 30px 7px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; }
  .search input::placeholder { color: #b8c6dc; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus { background: #fff; color: var(--ink); outline: none; border-color: #fff; }
  .search input:focus::placeholder { color: #888; }
  .search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; line-height: 1; color: #888; cursor: pointer; padding: 2px 6px; }

  /* ---------- sections ---------- */
  main { padding: 0 32px 40px; }
  .sect { max-width: 1280px; margin: 38px auto 0; scroll-margin-top: 64px; }
  .sect-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .sect-head h2 { font-size: 23px; font-weight: 800; color: var(--navy); }
  .sect-head p { font-size: 15px; color: var(--soft); flex: 1 1 380px; }

  /* ---------- the board (STEP-style bordered grid) ---------- */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: row dense; padding: 1px 0 0 1px; }
  .board.b4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .board.b2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell { border: 1px solid #000; margin: -1px 0 0 -1px; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  .s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .r2 { grid-row: span 2; }
  .cell-head { background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; text-align: center; padding: 10px 8px; border-bottom: 1px solid #000; }
  .cell-head.red { background: var(--red); }
  .cell-tag { background: var(--tag); color: var(--tag-ink); font-style: italic; font-size: 14px; text-align: center; padding: 6px 10px; border-bottom: 1px solid #000; }
  .cell-tag.mid { border-top: 1px solid #000; }
  .cell-body { padding: 12px 16px 14px; font-size: 14px; flex: 1; }
  .cell-body > p { margin-bottom: 8px; }

  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .rmain { min-width: 0; }
  .rt { font-weight: 600; }
  .rn { display: block; font-size: 12.5px; color: var(--soft); margin-top: 1px; }
  .meta { font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0; max-width: 42%; }
  .row.more { cursor: pointer; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
  .row.more:hover { background: #eef4fb; }
  .row.more .rt { color: var(--link); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
  .row.more .meta::after { content: ' ›'; font-size: 15px; color: var(--link); font-weight: 700; }
  .note { font-size: 13px; color: var(--soft); margin-bottom: 8px; }
  .callout { font-size: 13px; background: #fff7e6; border-left: 3px solid #d68a00; padding: 7px 10px; margin: 6px 0 8px; color: #4a3500; }
  .callout b { color: #3a2a00; }

  .pill { display: inline-block; font-size: 11px; font-weight: 700; font-style: normal; padding: 2px 8px; border-radius: 999px; margin: 0 4px 0 0; vertical-align: 1px; white-space: nowrap; }
  .pill-wh { background: var(--navy); color: #fff; }
  .pill-penn { background: #C4DCF7; color: #0B3A6E; }
  .pill-fy { background: #C6EBC4; color: #14501A; }
  .pill-later { background: #fff; color: #555; box-shadow: inset 0 0 0 1px #aaa; }
  .pill-app { background: #DCCCF2; color: #3A1D6E; }
  .pill-free { background: #A6EDE3; color: #04342C; }
  .pill-apply { background: #F8C4C4; color: #6B0F0F; }
  .pill-academic { background: #C4DCF7; color: #0B3A6E; }
  .pill-break { background: #FFF0A0; color: #4A3D00; }
  .pill-career { background: #FDD5AE; color: #6A3300; }
  .pill-life { background: #DCCCF2; color: #3A1D6E; }

  /* coming up */
  .due-item { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .due-item:last-child { border-bottom: none; }
  .due-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .due-title { font-weight: 600; }
  .due-date { font-weight: 700; font-size: 13px; color: var(--link); white-space: nowrap; text-align: right; }
  .due-rel { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
  .due-rel.soon { color: var(--red); }
  .due-note { font-size: 12.5px; color: var(--soft); margin-top: 2px; }
  .linkbtn { background: none; border: none; font: inherit; color: var(--link); text-decoration: underline; cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

  /* help now */
  .help-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .help-row:last-child { border-bottom: none; }
  .help-row b { display: block; }
  .help-row .rn { margin: 0; }
  .tel { font-weight: 700; color: var(--red); white-space: nowrap; text-decoration: none; font-size: 14px; }
  .tel:hover { color: var(--red-2); text-decoration: underline; }
  .emergency { background: var(--red); color: #fff; border-radius: 8px; text-align: center; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
  .emergency a { color: #fff; font-weight: 800; font-size: 16px; }

  /* checklist */
  .chk { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .chk:last-child { border-bottom: none; }
  .chk input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--blue); cursor: pointer; }
  .chk label { cursor: pointer; }
  .chk.done label { color: var(--muted); text-decoration: line-through; }
  .chk .rn a { font-weight: 600; }
  .progress { height: 8px; background: #fff; border-radius: 999px; margin: 5px auto 1px; max-width: 220px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(4,44,83,.25); }
  .progress i { display: block; height: 100%; background: var(--blue); transition: width .25s; }

  /* who to ask */
  .ask { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ask:last-child { border-bottom: none; }
  .ask-q { font-weight: 600; }
  .ask-a { font-size: 13px; color: var(--soft); margin-top: 1px; }

  /* timeline */
  .season ul { padding-left: 18px; font-size: 13.5px; }
  .season li { margin-bottom: 7px; }
  .season li:last-child { margin-bottom: 0; }

  /* finder + decoder tables */
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 2px solid #000; }
  table.data tr:last-child td { border-bottom: none; }
  table.data button { background: none; border: none; font: inherit; color: var(--link); font-weight: 600; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; text-align: left; }
  .gloss { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
  .gloss div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .gloss dt { font-weight: 700; color: var(--navy); }

  /* steps (numbered how-tos) */
  .step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: none; }
  .step-n { font-weight: 700; color: var(--link); }
  .step-title { font-weight: 600; }

  /* search results */
  #results[hidden], .sect[hidden] { display: none; }
  .res-meta { font-size: 11.5px; color: var(--muted); display: block; }
  mark { background: #ffe9a8; color: inherit; padding: 0 1px; border-radius: 2px; }

  /* ---------- detail pop-up ---------- */
  .dlg { margin: auto; width: 600px; max-width: calc(100vw - 28px); max-height: calc(100vh - 56px); border: 1px solid #000; border-radius: 10px; padding: 0; box-shadow: 0 10px 32px rgba(0,0,0,.25); }
  .dlg::backdrop { background: rgba(1, 31, 91, .4); }
  .dlg-bar { background: var(--blue); color: #fff; padding: 12px 48px 12px 20px; position: sticky; top: 0; z-index: 1; }
  .dlg-bar h2 { font-size: 18px; line-height: 1.25; }
  .dlg-bar .crumb { font-size: 12px; color: #cfdcf0; display: block; margin-bottom: 2px; }
  .dlg-close { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 26px; line-height: 1; color: #fff; cursor: pointer; padding: 2px 6px; }
  .dlg-body { padding: 16px 20px 18px; font-size: 14.5px; }
  .dlg-body p { margin-bottom: 9px; }
  .dlg-body ul { padding-left: 20px; margin-bottom: 9px; }
  .dlg-body li { margin-bottom: 4px; }
  .dlg-body h3 { font-size: 14.5px; margin: 14px 0 5px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--navy); }
  .facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 12px; margin: 0 0 12px; padding: 10px 12px; background: var(--shell); border-left: 3px solid var(--blue); border-radius: 0 6px 6px 0; font-size: 14px; }
  .facts dt { font-weight: 700; color: var(--blue); }
  .dlg-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .dlg-link { background: var(--blue); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; padding: 6px 13px; border-radius: 999px; }
  .dlg-link:hover { background: var(--link); color: #fff; }
  .dlg-link.alt { background: #fff; color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); }
  .dlg-foot { font-size: 12px; color: var(--muted); margin-top: 14px; }

  .footer { max-width: 1280px; margin: 44px auto 0; text-align: center; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }
  .footer a { color: var(--muted); }
  .totop { position: fixed; right: 18px; bottom: 18px; z-index: 25; background: var(--navy); color: #fff; border: none; border-radius: 999px; padding: 9px 14px; font: 700 13px inherit; font-family: inherit; box-shadow: 0 4px 14px rgba(0,0,0,.2); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .totop.show { opacity: 1; pointer-events: auto; }

  @media (max-width: 1099px) {
    .board, .board.b4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .s3 { grid-column: span 2; }
    .search { flex-basis: 190px; }
  }
  @media (max-width: 760px) {
    main { padding: 0 14px 30px; }
    .top { padding: 22px 16px 16px; }
    h1 { font-size: 23px; }
    .subtitle { font-size: 15px; }
    .jump-in { flex-wrap: wrap; padding: 8px 10px 0; gap: 4px; }
    .search { flex: 1 1 100%; order: -1; }
    .jump nav a { padding: 9px 9px 8px; font-size: 13px; }
    .board, .board.b4, .board.b2 { grid-template-columns: minmax(0, 1fr); }
    .s2, .s3 { grid-column: auto; } .r2 { grid-row: auto; }
    .sect { scroll-margin-top: 104px; }
    .gloss { grid-template-columns: minmax(0, 1fr); }
    .facts { grid-template-columns: 92px minmax(0, 1fr); }
    .meta { max-width: 38%; }
  }
  @media print {
    .jump, .totop, .search { display: none !important; }
    .cell { break-inside: avoid; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>

        f: [['Who', 'Every Wharton undergraduate is assigned a professional academic advisor; yours is named in your Path@Penn profile'], ['Best for', 'Course selection, requirements, concentrations, registration, long-term planning'], ['Booking', 'Use the remote or in-person scheduler on the advising services page. New slots open on Fridays for the following week; book at least 12 hours ahead.']],
        b: `<p>Wharton’s professional advising team helps you work through the curriculum, choose courses, understand requirements and concentrations, register, and plan further ahead.</p>
            <h3>Mention long-term plans early</h3>
            <p>Study abroad eligibility, concentration sequencing, dual degrees, and submatriculation all depend on courses you take in your first two years. Advisors can only plan around a constraint they know about.</p>`,
        l: [['Meet the advisors', U.academicAdvisors]] } },
      { t: 'Wharton peer advisors', u: U.peerAdvising, m: 'Juniors and seniors', d: {
        f: [['Who', 'Wharton juniors and seniors'], ['Where', 'ARB Suite 1400 front desk, weekdays 9–5'], ['Best for', 'Quick questions and a student’s view of courses and concentrations']],
        b: '<p>Peer advisors give student-to-student guidance on courses, concentrations, and getting around Wharton. Use them for quick questions and firsthand perspective; use your professional advisor for anything official.</p>',
        l: [['Meet the peer advisors', U.meetPeer]] } },
      { t: 'Wharton Undergraduate Division', u: U.contacts, m: 'ARB 1400', n: '265 S. 37th St · <a href="tel:2158987608">215-898-7608</a> · <a href="mailto:undergradinfo@wharton.upenn.edu">undergradinfo@wharton.upenn.edu</a>' },
      { t: 'Concentration advisors', u: U.concentrations, m: 'Faculty', n: 'For going deep on one field once you’re leaning toward a concentration.' },
      { t: 'Wharton GUIDE mentoring', u: U.guide, m: 'Upperclass mentor', n: 'Get matched with an upperclass Wharton student mentor.' },
      { t: 'Your College House team', u: U.collegeHouses, m: 'Where you live', n: 'RAs, GAs, and house staff for anything about living at Penn.' }
    ]},
    { h: 'Registration & Planning', rows: [
      { t: 'Path@Penn', u: U.path, m: 'Official system', n: 'Register, see your records and holds, and use Path Planner to map future semesters. <a href="' + U.pathHelp + '" target="_blank" rel="noopener">How-to guides</a>' },
      { t: 'Penn Course Plan', u: U.coursePlan, m: 'Mock scheduler', n: 'Build and compare draft schedules; pulls in ratings and seat alerts.' },
      { t: 'Penn Course Review', u: U.courseReview, m: 'Student ratings', n: 'Course and instructor ratings. One input alongside syllabi and your advisor.' },
      { t: 'Penn Course Alert', u: U.courseAlert, m: 'Seat alerts', n: 'Texts or emails you when a seat opens in a full class.' },
      { t: 'Penn academic calendar', u: U.calendar, m: 'Official dates', n: 'Breaks, finals, and registration windows. The key ones are in “Coming Up” above.' },
      { t: 'First-year registration guide', u: U.fyReg, p: ['wh'], m: 'Wharton', n: 'How registration works for Wharton first-years, step by step.' }
    ]},
    { h: 'When a Class Gets Hard', rows: [
      { t: 'Drop, withdraw & pass/fail deadlines', m: '2026–27 dates', d: {
        f: [['Fall 2026', 'Drop by Oct 5 · pass/fail by Oct 23 · withdraw by Nov 2'], ['Spring 2027', 'Add by Feb 2 · drop by Mar 1 · pass/fail by Mar 29 · withdraw by Apr 5']],
        b: `<p><b>Dropping</b> a course before the drop deadline leaves no record. <b>Withdrawing</b> after that leaves a W on your transcript but no grade. <b>Pass/fail</b> changes the grade type, but every course in your first semester must be letter-graded, and there are limits on which requirements a pass/fail course can fill, so check Wharton’s policies first.</p>
            <p>Before any of these, talk to your academic advisor: dropping below a full course load can affect financial aid, housing, and visa status, and some courses are prerequisites for next semester.</p>`,
        l: [['Penn academic calendar', U.calendar], ['Wharton academic policies', U.policies]] } },
      { t: 'Office hours', m: 'Start here', d: {
        f: [['Who', 'Your TAs and professors'], ['When', 'Listed on each course’s Canvas site or syllabus']],
        b: `<p><b>TA office hours</b> are for clarifying concepts, working through problem sets, and preparing for exams. Bring specific questions or work you’ve already attempted.</p>
            <p><b>Professor office hours</b> aren’t only for when you’re struggling. They’re how you build a relationship with a professor and explore material beyond lecture, and that relationship is what later turns into research opportunities and recommendation letters.</p>` } },
      { t: 'Weingarten tutoring', u: U.tutoring, m: 'Free', p: ['free'], n: 'Peer tutoring for selected courses. Book in TracCloud at least 48 hours ahead, or drop in at Houston Market, Mon–Thu 7:45–10:30 pm.' },
      { t: 'Learning consultations', u: U.learning, m: 'One-on-one', n: 'Tutoring is about the course; this is about how you study, manage time, and prepare for exams.' },
      { t: 'Marks Family Writing Center', u: U.marks, m: '<a href="' + U.marksAppt + '" target="_blank" rel="noopener">Book a session</a>', n: 'Feedback on organization, argument, and revision at any stage of a draft, including your Critical Writing Seminar papers.' },
      { t: 'Bridge to Math', u: U.bridgeMath, m: 'Student club', n: 'Student-run peer support for moving into Penn’s quantitative courses.' },
      { t: 'Weingarten Disability Services', u: U.disability, m: 'Accommodations', n: 'Connect early if you think you’ll need accommodations. Approval takes time.' }
    ]},
    { h: 'Wharton First-Year Basics', cls: 's3', cols: true, rows: [
      { t: 'Your STEP cohort', u: U.step, p: ['wh'], m: 'Your first community', d: {
        f: [['What', 'STEP: Successful Transition and Empowerment Program'], ['Size', '10 cohorts of about 60 first-years, split into pods led by upperclass cohort directors'], ['Linked to', 'WH 1010 Business & You, which you take with your cohort in the fall']],
        b: '<p>STEP is how Wharton first-years are organized into communities. Your cohort and pod are the people you’ll see in WH 1010, at townhalls, and at cohort events like treks, socials, and service days. Your cohort directors are upperclassmen whose job is to help you settle in, so ask them anything.</p>',
        l: [['STEP Linktree', U.stepLinktree]] } },
      { t: 'The Wharton curriculum', u: U.curriculum, m: '37 CUs to graduate', d: {
        f: [['Total', 'At least 37 course units (single degree)'], ['Leadership Journey', 'WH 1010 Business & You (first fall) → WH 2010 → MGMT 3010'], ['Business Fundamentals', 'Accounting, economics (BEPP 2500), finance, legal studies, management, marketing, operations (OIDD), and statistics'], ['Flex Fundamentals', 'Global Economy, Business & Society; Technology, Innovation & Analytics'], ['Depth', 'Business Breadth (3 CU) and a concentration (4 CU)'], ['Liberal Arts & Sciences', 'Humanities, natural science/math/engineering, social science, cross-cultural perspectives, and two semesters of a language'], ['Also', '5 unrestricted electives and a senior capstone']],
        b: `<h3>What first-years usually take</h3>
            <ul><li><b>WH 1010</b> (0.5 CU) in the fall, with your STEP cohort.</li>
            <li><b>BEPP 1000</b> (economics) and a math course.</li>
            <li>A <b>Critical Writing Seminar</b> in either semester.</li>
            <li>Liberal arts courses that also explore possible interests.</li></ul>
            <h3>First-semester rules</h3>
            <p>The fall cap is 5.5 CU and every first-semester course must be letter-graded. Some upper-level Wharton courses aren’t open to first-years. Check the first-year FAQ before you register.</p>`,
        l: [['First-year FAQ', U.fyFaq], ['Critical Writing Seminars', U.criticalWriting]] } },
      { t: 'Concentrations', u: U.concentrations, m: 'Declare from 4th semester', d: {
        f: [['When', 'You can first declare in your 4th semester (sophomore spring); declaring by the end of junior year is recommended'], ['How', 'Talk to an advisor, then submit the Declare/Update Field of Study form']],
        b: '<p>A concentration is Wharton’s version of a major: Finance, Marketing, Management, Business Analytics, and many more. You don’t need to pick one now. Use your first year to sample, and talk to concentration advisors once something clicks.</p>',
        l: [['How to declare', U.declare]] } },
      { t: 'Dual degrees & submatriculation', u: U.dualDegree, p: ['later'], m: 'Plan early', n: 'Apply for a dual degree after two semesters (3.40 GPA minimum). <a href="' + U.submat + '" target="_blank" rel="noopener">Submatriculation</a> lets you start a master’s early.' },
      { t: 'Joseph Wharton Scholars', u: U.jws, m: 'Honors program', n: 'Mostly invited at admission; first-years who weren’t can apply in May.' },
      { t: 'Wharton Research Scholars', u: U.wrs, p: ['later'], m: 'Sophomores and juniors', n: 'A year-long research thesis program (WH 2990).' },
      { t: 'Policies, petitions & forms', u: U.policies, m: 'The official rules', n: '<a href="' + U.petitions + '" target="_blank" rel="noopener">Petitions</a> for exceptions · <a href="' + U.forms + '" target="_blank" rel="noopener">academic forms</a>' },
      { t: 'Your class email list', u: U.fyComms, m: 'wugr list', n: 'You’re auto-subscribed to your class’s Wharton undergraduate (“UGR”) list. Read it; that’s where deadlines show up first.' }
    ]}
  ]},

{ id: 'involved', nav: 'Get Involved', title: 'Getting Involved', intro: 'Clubs, Greek life, cultural centers, and service. Most first-years try a few things in the fall and narrow down by spring.',
  cells: [
    { h: 'Clubs & Organizations', rows: [
      { t: 'How Wharton clubs work', m: 'Read first', d: {
        f: [['Overseen by', 'Wharton Council, with the Wharton Undergraduate Division'], ['How many', '50+ recognized Wharton clubs, mostly pre-professional'], ['Applications', 'No resumes, one interview of 30 minutes or less, no technical questions or group cases; decisions through Penn Clubs within two weeks']],
        b: `<p>Wharton clubs are overseen by the <b>Wharton Council</b>, which works with the Undergraduate Division on club budgets, recognition, registration, and general support. Most are pre-professional: investing, consulting, industry clubs, and similar.</p>
            <h3>Wharton clubs vs. SAC clubs</h3>
            <p>Business-focused groups go through Wharton rather than the Student Allocations Commission (SAC). Academic and pre-professional groups affiliated with Wharton or Engineering must be recognized by the Wharton Council or the Engineering Student Activities Council. For a group to be a Wharton club, a simple majority of its executive board must be Wharton undergraduates. A club not on the Council’s list is outside its jurisdiction.</p>
            <h3>Applying</h3>
            <p>Since fall 2025, Wharton Council’s recruitment policy caps the process: clubs can’t ask for resumes, can hold only one interview per applicant (30 minutes max), and can’t use technical questions or group cases. Decisions come through Penn Clubs within two weeks. There’s a centralized application window each semester. In spring 2026 it ran in late January, so watch your email in January for the spring round.</p>
            <p>Rejections still happen and say little about you. Apply broadly, and keep at least one club with no application in the mix.</p>
            <h3>Sponsored student organizations</h3>
            <p>Wharton also has business fraternities and sponsored organizations, including the Wharton Council itself, the Wharton Dean’s Undergraduate Advisory Board, Wharton Together, and Wharton FGLI.</p>`,
        l: [['Recruitment policies', U.whRecruiting], ['All Wharton clubs', U.whClubs], ['Penn Clubs', U.pennClubs], ['Daily Pennsylvanian coverage', U.dpClubs]] } },
      { t: 'Every Wharton club', u: U.whClubs, m: 'Official list' },
      { t: 'Wharton Council', u: U.whCouncil, m: 'Wharton club umbrella', n: '<a href="' + U.whRecruiting + '" target="_blank" rel="noopener">Club recruitment rules</a>' },
      { t: 'Wharton Women', u: U.whWomen, m: 'Large community club' },
      { t: 'Penn Clubs', u: U.pennClubs, m: '600+ groups', n: 'Every registered club at Penn: browse, filter, and follow. Log in with PennKey.' },
      { t: 'CampusGroups', u: U.campusGroups, m: 'Wharton events', n: 'RSVP to events and get announcements from Wharton groups you join. Filter for “New UGR Students.” <a href="' + U.campusGroupsHelp + '" target="_blank" rel="noopener">How to use it</a>' },
      { t: 'Dean’s Undergraduate Advisory Board', u: U.wab, p: ['fy'], m: 'Recruits each fall', n: 'Student voice to the Wharton dean; takes about five first-years each fall.' },
      { t: 'Wharton Leadership Ventures', u: U.leadVentures, m: 'Expeditions', n: 'Outdoor leadership trips open to Penn undergraduates.' }
    ]},
    { h: 'Greek Life', tag: 'Eligible once you have 4.0 CUs on your Penn transcript', rows: [
      { t: 'How joining works', u: U.ofslJoin, m: 'Eligibility', d: {
        f: [['Run by', 'Office of Fraternity and Sorority Life (OFSL)'], ['Eligibility', 'Full-time undergraduate in good standing with at least 4.0 course units on your Penn transcript'], ['First-years', 'Spring semester at the earliest']],
        b: `<p>OFSL recognizes chapters in three councils: the <b>Intercultural Greek Council</b> (IGC), the <b>Interfraternity Council</b> (IFC), and the <b>Panhellenic Council</b>. The 4.0 course-unit rule effectively rules out joining in your first semester.</p>`,
        l: [['OFSL: How to join', U.ofslJoin]] } },
      { t: 'Panhellenic Council (sororities)', m: 'Spring primary', d: {
        f: [['Recruitment', 'Fall Continuous Open Bidding and Spring Primary Recruitment'], ['Instagram', '@pennpanhellenic']],
        b: '<p>Second-semester first-years and older students who meet the requirements can do primary recruitment, which rotates through each of the seven chapters on campus.</p>',
        l: [['OFSL: How to join', U.ofslJoin]] } },
      { t: 'Interfraternity Council (fraternities)', m: 'Spring', d: {
        f: [['Register', 'Through Campus Director'], ['Instagram', '@penn.ifc']],
        b: '<p>Students register on Campus Director. During spring recruitment, chapters host events ranging from open houses to small coffee chats.</p>',
        l: [['IFC registration (Campus Director)', U.ifcPortal], ['OFSL: How to join', U.ofslJoin]] } },
      { t: 'Intercultural Greek Council', m: 'Culturally based', d: {
        b: '<p>The IGC includes culturally based and historically Black fraternities and sororities, including the Divine Nine (D9) organizations. Intake processes vary by chapter, so follow the chapters you’re interested in and go to their informational events.</p>',
        l: [['OFSL: How to join', U.ofslJoin]] } },
      { t: 'Recognized vs. unrecognized groups', u: U.ofslFamilies, m: 'Know the difference', n: 'Some off-campus groups aren’t recognized by Penn and aren’t part of its fraternity and sorority community.' }
    ]},
    { h: 'Cultural Resource Centers', tag: 'Open houses run in the first weeks of each semester', rows: [
      { t: 'All six centers', u: U.crc, m: 'University Life', n: 'Community hubs for cultural celebration, academic engagement, and belonging. Several are in ARCH, 3601 Locust Walk.' },
      { t: 'Greenfield Intercultural Center', u: U.gic, m: 'GIC', n: 'Intercultural understanding through activism, reflection, and dialogue.' },
      { t: 'Makuu: The Black Cultural Center', u: U.makuu, m: 'Makuu', n: 'Support with an emphasis on students of African descent.' },
      { t: 'La Casa Latina', u: U.casa, m: 'Center for Hispanic Excellence', n: 'Latino culture, issues, and identity at Penn.' },
      { t: 'Pan-Asian American Community House', u: U.paach, m: 'PAACH', n: 'East, South, and Southeast Asian and Pacific Islander American students and groups.' },
      { t: 'LGBT Center', u: U.lgbt, m: '25+ student groups', n: 'Peer mentorship, study and social space, and events.' },
      { t: 'Penn Women’s Center', u: U.pwc, m: 'PWC' }
    ]},
    { h: 'Community, Service & Support', cls: 's3', cols: true, rows: [
      { t: 'Civic House', u: U.civicHouse, m: 'Service hub', n: 'Penn’s center for community service and social justice, including paid internships.' },
      { t: 'Netter Center', u: U.netter, m: 'West Philadelphia', n: 'University–community partnerships, including ABCS courses that build service into class.' },
      { t: 'Penn First Plus', u: U.pennFirstPlus, m: 'First-gen / low-income', n: 'Community, mentoring, and practical support for first-generation and lower-income students.' },
      { t: 'Wharton FGLI', u: U.whFgli, m: 'Wharton community', n: 'Wharton’s first-gen, low-income student community; works with Penn First Plus.' },
      { t: 'International Student & Scholar Services', u: U.isss, m: 'ISSS', n: 'Visas, work authorization (including for internships), and support for international students.' },
      { t: 'Office of the Chaplain', u: U.chaplain, m: 'Religious life', n: 'Religious and spiritual communities, plus confidential pastoral support.' },
      { t: 'Office of Student Affairs', u: U.osa, m: 'Houston Hall', n: 'Student organization support and campus-wide programs.' },
      { t: 'Penn Student Agencies', u: U.psa, m: 'Student-run businesses', n: 'Get paid to help run real student businesses on campus.' }
    ]}
  ]},

{ id: 'global', nav: 'Abroad & Research', title: 'Global & Research', intro: 'Go abroad, get paid to do research, or both. Several of these are open in your first year, and their applications open months before the experience.',
  cells: [
    { h: 'Summer Research & Internships', cls: 'r2', tag: 'Most are open to first-years', rows: [
      { t: 'GRIP', u: U.grip, p: ['fy', 'penn'], m: 'Abroad, 8–12 wks', n: 'Global Research & Internship Program', d: {
        f: [['Open to', 'All non-graduating, full-time Penn undergraduates returning the next fall'], ['When', '8–12 weeks over the summer'], ['Funding', 'Guaranteed award for every accepted student; Highly Aided students get 100% of estimated cost'], ['Apply', '<b>Nov 4, 2026 – Jan 6, 2027 (noon ET)</b>, or earlier if a placement fills']],
        b: `<p>GRIP is Penn’s main international internship and research program, spanning business, finance, technology, engineering, healthcare, sustainability, community development, and more. There are three kinds of placement:</p>
            <ul><li><b>Direct internships</b> place you with a specific employer abroad. More independence; you may arrange your own housing.</li>
            <li><b>Cohort internships</b> send a small group of Penn students to one destination, where local partners match students to employers and often help with housing, visas, and airport pickup.</li>
            <li><b>Research placements</b> put you on a specific project under a faculty investigator at a university abroad.</li></ul>
            <h3>Placements can close early</h3>
            <p>Each placement caps applications (about 40 for cohort and research placements, 20 for direct placements), so popular ones can close well before January 6. Browse in the fall and apply early.</p>`,
        l: [['Application process', U.gripApply]] } },
      { t: 'PURM', u: U.purm, p: ['fy', 'penn'], m: 'At Penn, 10 wks', n: 'Penn Undergraduate Research Mentoring', d: {
        f: [['Open to', 'All Penn first- and second-years (you can do it once)'], ['When', '10 weeks over the summer'], ['Apply', 'Around Feb 15, 2027 (tentative)']],
        b: '<p>PURM matches students finishing their first or second year with Penn faculty research projects. Unlike SPUR or SIRE, you apply to existing faculty projects rather than writing a full proposal of your own. Projects span the whole university, so Wharton students can explore business research as well as economics, psychology, healthcare, engineering, science, social science, and the humanities.</p><p>If you have little or no research experience, this is one of the best ways in.</p>' } },
      { t: 'SPUR', u: U.spur, p: ['fy', 'wh'], m: 'At Penn, ~10 wks', n: 'Summer Program for Undergraduate Research', d: {
        f: [['Open to', 'Wharton undergraduates'], ['When', 'About 10 weeks over the summer, based at Penn'], ['Funding', 'Taxable award up to $6,000'], ['Apply', 'Around Mar 19, 2027 (tentative)']],
        b: '<p>SPUR supports independent research under a faculty mentor, carried out mainly on Penn’s campus. Projects can be theoretical or applied, qualitative or quantitative, and end in a research paper that can be published through ScholarlyCommons. Students working with Wharton faculty get priority.</p><p><b>SPUR vs. SIRE:</b> SPUR can take on almost any business research question. SIRE requires the project to address both economic and social value.</p>' } },
      { t: 'SIRE', u: U.sire, p: ['fy', 'wh'], m: 'U.S. or abroad', n: 'Social Impact Research Experience', d: {
        f: [['Open to', 'Wharton undergraduates'], ['Topics', 'Social impact, policy, sustainability, healthcare, development, inequality, education'], ['Funding', 'Up to $6,000 for approved travel and lodging; up to ten awards'], ['Apply', 'Around Feb 12, 2027 (tentative)']],
        b: '<p>SIRE funds Wharton undergraduates to design and run independent research that creates both economic and social value, in the U.S. or abroad, using quantitative or qualitative methods. You work with a faculty advisor for the equivalent of at least 20 hours a week for about two months. Projects end with a formal paper, publication on ScholarlyCommons, and a symposium presentation.</p><p><b>SIRE vs. WRAP:</b> SIRE is your own project. WRAP places you as a research assistant to a researcher at another institution.</p>' } },
      { t: 'WRAP', u: U.wrap, p: ['fy', 'wh'], m: 'Abroad, 8–12 wks', n: 'World Research Assistantship Program', d: {
        f: [['Open to', 'Wharton undergraduates in good standing; no research experience needed'], ['When', '8–12 weeks over the summer, at least 20 hours a week'], ['Funding', 'Taxable award up to $6,000 for travel and lodging'], ['Apply', '2027 deadline not yet posted; it usually falls in early spring']],
        b: `<p>WRAP places Wharton undergraduates as research assistants at a university or think tank outside Penn, usually abroad, on business-related research under a research mentor. Afterward you submit a research summary and blog post and present at a symposium.</p>
            <p>The unusual part: you don’t need to find an overseas professor yourself. You find a Wharton faculty advisor who helps develop the project and, if you’re selected, helps connect you with the right institution.</p>
            <p><b>WRAP vs. GRIP:</b> GRIP gives you a set of existing placements to apply to. WRAP is student-designed and specifically about business research.</p>` } },
      { t: 'Penn Global Research Institutes', u: U.pgri, p: ['penn'], m: 'Faculty-led, abroad', d: {
        f: [['Open to', 'Varies by institute; often open to first-years'], ['Funding', 'Covers required summer research and travel costs']],
        b: '<p>PGRI lets you do research abroad alongside Penn professors, local researchers, community members, and other Penn students. Projects take on major global challenges and pair research training on campus with fieldwork abroad. Current institutes cover global education, climate adaptation, community research, documentary work, and other interdisciplinary fields.</p>' } },
      { t: 'Wharton Summer Internship Award', u: U.internshipAward, p: ['wh'], m: 'Up to $5,000', d: {
        f: [['For', 'Unpaid or modestly paid internships of at least 8 weeks with a government agency, U.S. nonprofit, or Certified B Corp'], ['Funding', 'Up to $500 a week for up to 10 weeks ($5,000 max)'], ['Apply', 'Rolling, through Apr 27, 2027']],
        b: '<p>Useful when you find a role you care about but couldn’t otherwise afford to take.</p>' } }
    ]},
    { h: 'Go Abroad: Short Programs', tag: 'About a week, during breaks or summer', rows: [
      { t: 'Penn Global Seminars', u: U.pgs, p: ['fy', 'penn'], m: '$950 flat fee', d: {
        f: [['Open to', 'Full-time Penn undergraduates in any school or year (some courses have prerequisites)'], ['Format', 'A regular 1 CU course plus about a week of travel during a break'], ['Cost', '$950 for 2026–27, covering airfare, lodging, in-country travel, entrance fees, and some meals. Financial aid applies.']],
        b: '<p>Penn Global Seminars pair a semester in the classroom with short-term international travel led by Penn faculty. About 20 run in 2026–27. Destinations and topics change every year. Recent seminars covered business communication in the UK, sustainability in Latin America, traditional Chinese medicine in China, and global aging in Malawi, with others going to Japan, Italy, Brazil, and Korea.</p><p>One of the most accessible ways to travel with Penn, since the fee is flat and aid applies.</p>' } },
      { t: 'W3i International Courses', u: U.w3i, p: ['fy'], m: 'WH 2980, 0.5 CU', d: {
        f: [['Open to', 'Penn undergraduates in good standing (some courses limit class years); at most two W3i courses at Penn'], ['When', 'Roughly 7–9 days during breaks'], ['Spring 2027', 'Stockholm (May 23–29) abroad, plus domestic trips to Miami and San Francisco']],
        b: '<p>W3i courses, formerly the Wharton International Program (WIP), are faculty-led business courses built around travel: company visits, lectures at partner universities, cultural activities, and conversations with executives and alumni. They focus on a region’s business environment, local business practices, and intercultural communication.</p><p>Recent destinations include Tokyo, Portugal, Colombia, and Stockholm. Applications for spring trips close in the fall, so check the page early each semester.</p>' } },
      { t: 'Penn Summer Abroad', u: U.summerAbroad, p: ['penn'], m: '1–10 weeks', d: {
        f: [['Open to', 'Varies by program'], ['2027 apps', 'Open Nov 1, 2026; early deadline Jan 31; final deadline Feb 15, 2027']],
        b: '<p>Faculty-led and partner-university summer programs abroad, typically four to ten weeks. Wharton highlights Copenhagen Business School, the Chinese University of Hong Kong, and the Hong Kong University of Science and Technology. Penn-run programs include options in France, Spain, and Italy. Financial aid may be available depending on the program.</p>' } },
      { t: 'Global Modular Courses', u: U.gmc, p: ['later'], m: 'Juniors and seniors', d: {
        f: [['Open to', 'Wharton juniors and seniors (seniors can’t take May courses), plus MBA/EMBA students'], ['When', '3–7 days during breaks'], ['First-years', NOTYET]],
        b: '<p>Intensive Wharton courses taught where the topic matters most, combining Wharton faculty, local universities, regional business leaders, and team projects. Around 17 run in 2026–27. Not open to you yet, but worth knowing about.</p>' } }
    ]},
    { h: 'A Semester Abroad', tag: 'Usually junior year; plan in year one', rows: [
      { t: 'Wharton semester abroad', u: U.semesterAbroad, p: ['later'], m: 'Read this early', d: {
        f: [['When', 'Fall or spring, most often junior year'], ['GPA', '3.0 cumulative, and 3.0 in each of the previous two semesters'], ['Credit', 'Business Breadth, Liberal Arts & Sciences, and unrestricted electives; generally not concentration or Business Fundamentals courses'], ['First-years', NOTYET]],
        b: '<p>Wharton recommends planning about a year ahead. Sophomore spring is possible but comes with extra academic requirements. Because the courses you take in your first two years decide whether you’ll be eligible later, tell your academic advisor early if a semester abroad is on your mind.</p>',
        l: [['Wharton-approved programs', U.approvedPrograms]] } },
      { t: 'Wharton-approved programs', u: U.approvedPrograms, m: 'Where you can go' },
      { t: 'Wharton Global Opportunities', u: U.whGlobal, m: 'Wharton overview', n: 'Wharton encourages at least one international experience before you graduate.' },
      { t: 'Penn Abroad', u: U.pennAbroad, m: 'Penn’s hub', n: 'Semester programs, PGS, GRIP, PGRI, funding, and advising.' },

{ id: 'careers', nav: 'Careers', title: 'Career Planning', intro: 'How recruiting actually works at Penn, and what’s worth doing in year one (hint: exploring counts).',
  cells: [
    { h: 'Career Services & Handshake', rows: [
      { t: 'Penn Career Services', u: U.careers, m: 'One office for all', d: {
        f: [['Where', '3935 Walnut Street, Suite 300 (weekdays 9–5)'], ['Phone', '<a href="tel:2158987531">215-898-7531</a>'], ['Email', '<a href="mailto:careerservices@vpul.upenn.edu">careerservices@vpul.upenn.edu</a>']],
        b: `<p>There’s no separate Wharton undergraduate career office. Career Services is the career office for undergraduates in the College, Engineering, Nursing, and Wharton alike. Separate offices exist only for Wharton MBA/EMBA, Dental, Law, and Vet, and Wharton’s own site points undergraduates here.</p>
            <h3>Three kinds of advising</h3>
            <ul><li><b>Full appointments</b> with a career advisor, requested through Handshake.</li>
            <li><b>Same-day drop-ins:</b> from 9:15 am ET on weekdays, availability appears in Handshake for a 15-minute virtual chat later that day.</li>
            <li><b>Peer Career Advisors:</b> trained undergraduates who hold 15-minute “Pop-ins” (one per day), booked in Handshake.</li></ul>
            <h3>Resume and cover letter reviews</h3>
            <p>Submit a resume or cover letter for written feedback. Allow up to a week, or two at peak recruiting times. Wharton students are eligible.</p>`,
        l: [['Undergraduate hub', U.careersStudent], ['Same-day drop-ins', U.csWalkins], ['Peer Career Advisors', U.csPeer], ['Resume & cover letter reviews', U.csCritique]] } },
      { t: 'Handshake', u: U.handshake, m: 'System of record', n: 'Jobs, internships, employer events, advising appointments, and on-campus interview schedules. Filter Jobs by “interviewing on campus.”' },
      { t: 'Four-year career timeline', u: U.csTimeline, m: 'Year by year', n: 'What to do in your first year, and what can wait.' },
      { t: 'Resume templates & guide', u: U.csResume, m: 'Start here', n: 'Penn-formatted undergraduate templates. Also the <a href="' + U.csCover + '" target="_blank" rel="noopener">cover letter guide</a>.' },
      { t: 'Industry communities', u: U.csCommunities, m: '20+ fields', n: 'Guides, jobs, and events by field, including an investment banking interview workshop and a finance technical mock-interview guide. Sign up for each field’s emails with your PennKey.' },
      { t: 'Career Readiness @ Wharton (CR@W)', u: U.crw, p: ['wh'], m: 'Spring program', n: 'Four Friday sessions in February; the application opens in November.' }
    ]},
    { h: 'Recruiting 101', rows: [
      { t: 'On-campus recruiting (OCR)', m: 'How it works', d: {
        f: [['When', 'Fall and spring, for internships and full-time roles'], ['Where', 'In-person interviews at 3935 Walnut Street'], ['Scale', '250+ employers hold information sessions on campus each year']],
        b: `<p>Employers interview on campus across financial services, consulting, technology, engineering, and more. The most common format is the <b>pre-select schedule</b>: the employer reviews applications and picks whom to interview. Info sessions often include recent Penn alumni, so they’re a good place to ask questions.</p>
            <p>Mock interviews by job type and industry are available through Career Services.</p>` } },
      { t: 'Recruiting timing', m: 'Earlier every year', d: {
        b: `<p>Timing depends on the industry and keeps moving earlier. <b>Finance and consulting run far ahead of most other fields</b>, with some firms recruiting sophomores for internships more than a year out.</p>
            <p>Rather than assuming one shared calendar, use the industry communities and the Outcomes data on Career Services’ site to see real hiring timelines for the field you care about.</p>
            <h3>Offer deadlines</h3>
            <p>Career Services encourages employers to give students two weeks to decide on offers. That’s a guideline, not a rule. If you get an exploding offer, talk to an advisor.</p>`,
        l: [['Industry communities', U.csCommunities], ['Post-graduate outcomes', U.csOutcomes]] } },
      { t: 'Where Wharton grads end up', u: U.csOutcomes, m: 'Outcomes data', d: {
        f: [['Median salary', '$110,000 for the Wharton Class of 2025 (mean $111,819), per the Daily Pennsylvanian'], ['Penn-wide', 'Financial services was 34% and consulting 17% of known first jobs for the Class of 2025']],
        b: '<p>Career Services publishes post-graduate outcomes reports by school, including industries, employers, cities, and salaries. They’re the most honest picture of where people actually go, and a good antidote to the idea that everyone ends up in banking or consulting.</p>',
        l: [['Reports by school', 'https://careerservices.upenn.edu/post-graduate-outcomes/undergrad-reports-by-school/'], ['DP: Class of 2025 data', U.dpOutcomes]] } },
      { t: 'Career fairs', u: U.csFairs, m: 'Spring 2027 dates TBA', n: 'The Spring Career & Internship Fair is usually in late January or early February. Spring 2027 also has a Summer Opportunities & Funding Fair.' },
      { t: 'What should a first-year actually do?', m: 'Advice', d: {
        b: `<ul><li>Explore: go to a few info sessions and club events in fields you’re curious about.</li>
            <li>Build a one-page resume and get it reviewed at a drop-in.</li>
            <li>Make a Handshake profile so employers and Career Services can reach you.</li>
            <li>For the summer, any of these is a real option: research (PURM, SPUR, SIRE, WRAP), GRIP abroad, an internship, a job, or a break. Very few first-years land traditional finance or consulting internships, and that’s normal.</li>
            <li>Talk to upperclassmen in clubs. That’s where most of the real recruiting knowledge lives.</li></ul>` } }
    ]},
    { h: 'Funding & Networking', rows: [
      { t: 'Summer funding has been cut', m: 'What’s left', d: {
        b: `<p>Career Services has sharply cut its summer funding. For summer 2026 it was limited to the Turner Schulman Human Rights Internship Award (College students only, up to $5,000); the executive director said no other funds were available for summer 2026.</p>
            <h3>Still available</h3>
            <ul><li><b>Highly Aided Summer Internship &amp; Research Funding</b> (through SRFS): up to $5,000 for unpaid or underpaid internships or research, for Highly Aided first-years through juniors. In 2026 it opened in early March with an April 14 priority deadline.</li>
            <li><b>Wharton Summer Internship Award</b>: up to $5,000 for nonprofit, government, or B Corp internships.</li>
            <li><b>CURF research grants</b> and <b>PURM</b>.</li>
            <li><b>GRIP</b>: every accepted student gets a funding award.</li>
            <li><b>Venture Lab StartUp Internship Award</b>, for internships at startups.</li>
            <li><b>Civic House internships</b>.</li></ul>`,
        l: [['Highly Aided summer funding', U.haFunding], ['All Penn funding sources', U.csFunding], ['Wharton Summer Internship Award', U.internshipAward], ['DP coverage', U.dpFunding]] } },
      { t: 'Highly Aided summer funding', u: U.haFunding, m: 'Up to $5,000', n: 'For unpaid or underpaid summer work. Watch for the application in early March.' },
      { t: 'MyPenn alumni directory', u: U.myPenn, m: 'Formerly QuakerNet', n: 'Search 400,000+ Penn alumni by company, industry, or city. Polite cold emails work better than you’d think.' },
      { t: 'CareerShift', u: U.csCareerShift, m: 'Contact lists', n: 'Find and organize contacts at target employers. Can filter for H-1B, OPT, and EAD sponsors.' },
      { t: 'Clubs are the Wharton pipeline', m: 'Treks, coffee chats', n: 'Treks, coffee chats, and firm workshops mostly happen through club programming.' }
    ]},
    { h: 'Entrepreneurship & Impact', cls: 's3', cols: true, tag: 'Building something, or want to work somewhere that is?', rows: [
      { t: 'Venture Lab', u: U.ventureLab, p: ['penn'], m: 'Penn’s startup hub', n: 'Programs, mentors, and funding for student founders (formerly Penn Wharton Entrepreneurship).' },
      { t: 'Tangen Hall', u: U.tangen, m: '40th & Sansom', n: 'Penn’s student entrepreneurship building. Open to any PennCard holder, weekdays 7 am–10 pm.' },
      { t: 'Penn Wharton Innovation Fund', u: U.innovationFund, m: 'Startup funding', n: 'Any Penn student can lead an application. 2027 rounds: Jan 24 and Mar 14.' },
      { t: 'Venture Initiation Program', u: U.vip, m: 'Accelerator', n: 'Workspace and support for early-stage student ventures.' },
      { t: 'Bet on Entrepreneurship', u: U.betOn, p: ['fy'], m: 'FGLI first- and second-years', n: 'Entrepreneurship program for first-gen and lower-income students. Applications are in the fall (closed for 2026–27).' },
      { t: 'StartUp Internship Award', u: U.startupAward, m: 'For startup interns', n: 'Funding once you’ve accepted a startup internship. The 2026 deadline was June 1.' },
      { t: 'Civic House internships', u: U.civicCei, m: 'Paid', n: 'Community Engagement Internship: 10 hrs/week during the year or 35 hrs/week in summer; work-study students get priority.' },
      { t: 'Netter Center summer program', u: U.netterStudents, m: 'Paid + housing', n: 'Penn Program for Public Service: 11 weeks in West Philadelphia, paid hourly, with housing.' }

  ['PennKey', 'Your Penn username and password, used for almost everything.'],
  ['PennCard', 'Your Penn ID. Opens doors, holds PennCash, gets you into the gym and libraries.'],
  ['CU', 'Course unit. Most classes are 1.0 CU; W3i courses are 0.5.'],
  ['Path@Penn', 'The official system for registration, records, and billing.'],
  ['Advance registration', 'When you request next semester’s classes, partway through each term.'],
  ['Drop / withdraw', 'Dropping leaves no record; withdrawing later in the term leaves a W on your transcript.'],
  ['P/F', 'Pass/fail grade type. There’s a deadline each term to switch.'],
  ['Concentration', 'Wharton’s version of a major, like Finance or Marketing.'],
  ['JMHH', 'Jon M. Huntsman Hall, Wharton’s main building on Walnut St.'],
  ['SHDH', 'Steinberg Hall-Dietrich Hall, the older Wharton building on Locust Walk.'],
  ['ARB', 'Academic Research Building, Wharton’s faculty building; peer advisors are in Suite 1400.'],
  ['Van Pelt / VP', 'Van Pelt-Dietrich Library Center, the main library. Lippincott is inside.'],
  ['Lippincott', 'Wharton’s business library, home of the Bloomberg terminals.'],
  ['Locust Walk', 'The main pedestrian path through campus.'],
  ['The Quad', 'The Quadrangle, a first-year College House.'],
  ['ARCH', '3601 Locust Walk, home to several Cultural Resource Centers.'],
  ['Houston Hall', 'The student union, on Spruce St near Locust Walk.'],
  ['Pottruck', 'Penn’s main gym, on Walnut St.'],
  ['RA / GA', 'Residential Advisor (an undergraduate) and Graduate Associate in your College House.'],
  ['OCR / OCI', 'On-campus recruiting / interviews, run through Handshake.'],
  ['CURF', 'Center for Undergraduate Research & Fellowships.'],
  ['SRFS', 'Student Registration & Financial Services: aid, billing, registration.'],
  ['FGLI', 'First-generation, low-income.'],
  ['SAC', 'Student Allocations Commission, which funds most non-Wharton clubs.'],
  ['UA', 'Undergraduate Assembly, Penn’s student government.'],
  ['CRC', 'Cultural Resource Centers: GIC, Makuu, La Casa Latina, PAACH, the LGBT Center, and the Penn Women’s Center.'],
  ['Penn Labs', `The student group behind Penn Mobile, <a href="${U.coursePlan}" target="_blank" rel="noopener">Penn Course Plan</a>, <a href="${U.courseReview}" target="_blank" rel="noopener">Penn Course Review</a>, and <a href="${U.courseAlert}" target="_blank" rel="noopener">Penn Course Alert</a>.`],
  ['Dining Dollars', 'Money on your dining plan for cafés and mobile ordering.'],
  ['Spring Fling', 'Penn’s big end-of-year spring festival.'],
  ['Quakers', 'Penn’s athletics teams and unofficial nickname for students.']
];

/* =====================================================================
   RENDERING (no need to edit below this line)
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plain = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
const ext = u => /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '';
const slug = s => plain(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const PILLS = { wh: 'Wharton only', penn: 'All of Penn', fy: 'First-years can apply', later: 'Plan for later', app: 'App', free: 'Free',
                apply: 'Apply', academic: 'Academic', break: 'Break', career: 'Career', life: 'Campus life' };
const pill = k => PILLS[k] ? `<span class="pill pill-${k}">${PILLS[k]}</span>` : '';

const today = new Date(); today.setHours(0, 0, 0, 0);
const day = s => new Date(s + 'T00:00:00');
const fmt = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const until = d => Math.round((d - today) / 864e5);
const relText = n => n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n < 14 ? `In ${n} days` : n < 70 ? `In ${Math.round(n / 7)} weeks` : '';

/* ---- details registry: every row with `d` gets an index + a shareable #slug ---- */
const DETAILS = [];
SECTIONS.forEach(s => s.cells.forEach(c => (c.rows || []).forEach(r => {
  if (r.d) r._d = DETAILS.push({ r, sect: s.title, cell: c.h, slug: slug(r.t) }) - 1;
})));

function rowHtml(r, where) {
  const pills = (r.p || []).map(pill).join('');
  const note = r.n ? `<span class="rn">${r.n}</span>` : '';
  const whereTxt = where ? `<span class="res-meta">${where}</span>` : '';
  if (r.d) {
    return `<div class="row more" role="button" tabindex="0" aria-haspopup="dialog" data-d="${r._d}">
      <span class="rmain">${whereTxt}<span class="rt">${r.t}</span> ${pills}${note}</span><span class="meta">${r.m || 'Details'}</span></div>`;
  }
  const title = r.u ? `<a class="rt" href="${r.u}"${ext(r.u)}>${r.t}</a>` : `<span class="rt">${r.t}</span>`;
  return `<div class="row"><span class="rmain">${whereTxt}${title} ${pills}${note}</span>${r.m ? `<span class="meta">${r.m}</span>` : ''}</div>`;
}

function renderDates(showAll) {
  const live = DATES.filter(x => day(x.end || x.date) >= today)
    .map(x => {
      const start = day(x.date), end = x.end ? day(x.end) : null;
      const started = start <= today;
      let label, n;
      if (x.window) { label = started ? 'Closes ' + fmt(end) : 'Opens ' + fmt(start); n = until(started ? end : start); }
      else if (end) { label = started ? 'Through ' + fmt(end) : fmt(start) + ' – ' + fmt(end); n = until(started ? end : start); }
      else { label = fmt(start); n = until(start); }
      return { x, label, n, sortKey: started && end ? end : start };
    })
    .sort((a, b) => a.sortKey - b.sortKey);
  if (!live.length) return '<p class="note" style="margin:0">Nothing on the calendar right now.</p>';
  const LIMIT = 7;
  const shown = showAll ? live : live.slice(0, LIMIT);
  const html = shown.map(({ x, label, n }) => {
    const rel = relText(n);
    const title = x.u ? `<a href="${x.u}"${ext(x.u)}>${x.t}</a>` : x.t;
    return `<div class="due-item"><div class="due-top"><span class="due-title">${pill(x.tag)}${title}</span>
      <span class="due-date">${label}${x.tbd ? ' <span style="font-weight:400;color:#777">(tentative)</span>' : ''}${rel ? `<span class="due-rel${n <= 7 ? ' soon' : ''}">${rel}</span>` : ''}</span></div>
      ${x.n ? `<div class="due-note">${x.n}</div>` : ''}</div>`;
  }).join('');
  const more = live.length > LIMIT
    ? `<button class="linkbtn" type="button" data-dates="${showAll ? 'less' : 'all'}">${showAll ? 'Show fewer' : `Show all ${live.length} dates`}</button>` : '';
  return `<div id="dates">${html}${more}</div>`;
}

function renderHelp() {
  return `<div class="emergency">Emergency? Penn Police <a href="tel:2155733333">215-573-3333</a> or <a href="tel:911">911</a></div>` +
    HELP.map(h => `<div class="help-row"><span><b>${h.u ? `<a href="${h.u}"${ext(h.u)} style="color:inherit">${h.t}</a>` : h.t}</b><span class="rn">${h.n}</span></span>
      <a class="tel" href="tel:${h.tel.replace(/\D/g, '')}">${h.tel}</a></div>`).join('');
}

const CHK_KEY = 'fyhub-checklist-v1';
let checked = new Set();
try { checked = new Set(JSON.parse(localStorage.getItem(CHK_KEY) || '[]')); } catch (e) {}
function renderChecklist() {
  const n = CHECKLIST.filter(c => checked.has(c.id)).length;
  return `<div class="cell-tag" style="margin:-12px -16px 8px">${n} of ${CHECKLIST.length} done · saved in this browser
      <div class="progress" aria-hidden="true"><i style="width:${(n / CHECKLIST.length * 100).toFixed(0)}%"></i></div></div>` +
    CHECKLIST.map(c => `<div class="chk${checked.has(c.id) ? ' done' : ''}"><input type="checkbox" id="chk-${c.id}" data-chk="${c.id}"${checked.has(c.id) ? ' checked' : ''} />
      <div><label for="chk-${c.id}">${c.t}</label>${c.n ? `<span class="rn">${c.n}</span>` : ''}</div></div>`).join('');
}

function renderFinder() {
  const btn = t => { const i = DETAILS.findIndex(x => plain(x.r.t) === t); return i < 0 ? t : `<button type="button" data-d="${i}">${t}</button>`; };
  return `<table class="data"><thead><tr><th>If you want to…</th><th>Look at</th></tr></thead><tbody>` +
    FINDER.map(([want, ...progs]) => `<tr><td>${want}</td><td>${progs.map(btn).join(' or ')}</td></tr>`).join('') + '</tbody></table>';
}

function renderGlossary() {
  return `<dl class="gloss">${GLOSSARY.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>`;
}

function cellHtml(c) {
  const head = `<div class="cell-head${c.red ? ' red' : ''}">${c.h}</div>${c.tag ? `<div class="cell-tag">${c.tag}</div>` : ''}`;
  const inner = c.body ? c.body() : (c.rows || []).map(r => rowHtml(r)).join('');
  const style = c.cols ? ' style="columns: 2 320px; column-gap: 32px;"' : '';
  return `<section class="cell ${c.cls || ''}">${head}<div class="cell-body"${style}>${inner}${c.foot || ''}</div></section>`;
}

$('sections').innerHTML = SECTIONS.map(s => `
  <section class="sect" id="${s.id}" aria-labelledby="h-${s.id}">
    <div class="sect-head"><h2 id="h-${s.id}">${s.title.replace(/&(?!amp;)/g, '&amp;')}</h2>${s.intro ? `<p>${s.intro}</p>` : ''}</div>
    <div class="board ${s.board || ''}">${s.cells.map(cellHtml).join('')}</div>
  </section>`).join('');
// cells-with-columns: keep rows from splitting across columns
document.querySelectorAll('.cell-body[style*="columns"] .row').forEach(r => r.style.breakInside = 'avoid');

$('jumpnav').innerHTML = SECTIONS.map(s => `<a href="#${s.id}" data-nav="${s.id}">${s.nav}</a>`).join('');
$('stamp').textContent = 'Last checked ' + UPDATED + '. Confirm dates on each office’s own page before you rely on them.';
$('footer').innerHTML = `Not an official Penn or Wharton site. Programs, funding, and deadlines change every year.<br />
  Spot a broken link or something out of date? Email <a href="mailto:${CONTACT.email}">${CONTACT.name}</a>.`;

/* ---- interactions ---- */
document.addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.chk;
  if (!id) return;
  e.target.checked ? checked.add(id) : checked.delete(id);
  try { localStorage.setItem(CHK_KEY, JSON.stringify([...checked])); } catch (err) {}
  const body = e.target.closest('.cell-body');
  body.innerHTML = renderChecklist();
  const again = document.getElementById('chk-' + id); if (again) again.focus();
});

document.addEventListener('click', e => {
  const datesBtn = e.target.closest('[data-dates]');
  if (datesBtn) { $('dates').outerHTML = renderDates(datesBtn.dataset.dates === 'all'); return; }
  if (e.target.closest('a')) return;
  const more = e.target.closest('[data-d]');
  if (more) openDetail(+more.dataset.d);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.row.more')) { e.preventDefault(); openDetail(+e.target.dataset.d); }
});

/* ---- detail pop-up ---- */
const dlg = $('dlg');
let lastHash = '';
function openDetail(i) {
  const x = DETAILS[i]; if (!x) return;
  const r = x.r, d = r.d;
  $('dlg-crumb').textContent = plain(x.sect) + ' › ' + plain(x.cell);
  $('dlg-title').innerHTML = r.t;
  const facts = d.f ? `<dl class="facts">${d.f.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : '';
  const links = [];
  if (r.u) links.push(['Official page', r.u]);
  (d.l || []).forEach(l => { if (!links.some(x => x[1] === l[1])) links.push(l); });
  const pills = (r.p || []).length ? `<p>${r.p.map(pill).join('')}</p>` : '';
  $('dlg-body').innerHTML = pills + (r.n ? `<p style="color:#555;font-style:italic">${r.n}</p>` : '') + facts + (d.b || '') +
    (links.length ? `<div class="dlg-links">${links.map(([l, u], j) => `<a class="dlg-link${j ? ' alt' : ''}" href="${u}"${ext(u)}>${l} ↗</a>`).join('')}</div>` : '') +
    `<p class="dlg-foot">Details change year to year. Check the official page before you apply. <a href="#${x.slug}" id="dlg-share">Link to this card</a></p>`;
  if (!dlg.open) { lastHash = location.hash; dlg.showModal(); }
  history.replaceState(null, '', '#' + x.slug);
  dlg.scrollTop = 0;
}
dlg.querySelector('.dlg-close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => history.replaceState(null, '', lastHash && !DETAILS.some(x => '#' + x.slug === lastHash) ? lastHash : location.pathname + location.search));
dlg.addEventListener('click', e => {
  if (e.target.id === 'dlg-share') { e.preventDefault(); navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => { e.target.textContent = 'Link copied'; }); }
});
function openFromHash() {
  const h = location.hash.slice(1); if (!h) return;
  const i = DETAILS.findIndex(x => x.slug === h);
  if (i >= 0) openDetail(i);
}

/* ---- search ---- */
const INDEX = [];
SECTIONS.forEach(s => s.cells.forEach(c => (c.rows || []).forEach(r => INDEX.push({
  kind: 'row', r, where: plain(s.title) + ' › ' + plain(c.h),
  text: plain([r.t, r.n, r.m, r.d && r.d.b, r.d && r.d.f && r.d.f.map(f => f.join(' ')).join(' '), (r.p || []).map(p => PILLS[p]).join(' ')].join(' ')).toLowerCase()
}))));
DATES.forEach(x => INDEX.push({ kind: 'row', r: { t: x.t, u: x.u, n: x.n, m: fmt(day(x.end || x.date)) }, where: 'Coming Up', text: plain(x.t + ' ' + (x.n || '')).toLowerCase() }));
HELP.forEach(h => INDEX.push({ kind: 'row', r: { t: h.t, u: h.u, n: h.n, m: `<a class="tel" href="tel:${h.tel.replace(/\D/g, '')}">${h.tel}</a>` }, where: 'Need Help Now', text: plain(h.t + ' ' + h.n).toLowerCase() }));
ASK.forEach(([q, a]) => INDEX.push({ kind: 'html', html: `<div class="ask"><span class="res-meta">Who Do I Ask?</span><div class="ask-q">${q}</div><div class="ask-a">${a}</div></div>`, text: plain(q + ' ' + a).toLowerCase() }));
GLOSSARY.forEach(([t, d]) => INDEX.push({ kind: 'row', r: { t, n: d }, where: 'Penn-Speak Decoder', text: plain(t + ' ' + d).toLowerCase() }));

const q = $('q'), qClear = $('q-clear');
let qTimer;
function runSearch() {
  const term = q.value.trim().toLowerCase();
  qClear.hidden = !term;
  const searching = term.length >= 2;
  $('results').hidden = !searching;
  $('sections').hidden = searching;
  if (!searching) return;
  const top = $('results').getBoundingClientRect().top;
  if (top < 0 || top > innerHeight * 0.6) scrollTo({ top: scrollY + top - 70 });
  const words = term.split(/\s+/);
  const hits = INDEX.filter(x => words.every(w => x.text.includes(w)));
  const titleHit = x => x.r && words.every(w => plain(x.r.t).toLowerCase().includes(w)) ? 0 : 1;
  hits.sort((a, b) => titleHit(a) - titleHit(b));
  $('results-title').textContent = hits.length ? `${hits.length} result${hits.length === 1 ? '' : 's'} for “${q.value.trim()}”` : `No results for “${q.value.trim()}”`;
  $('results-body').innerHTML = hits.length
    ? hits.map(x => x.kind === 'html' ? x.html : rowHtml(x.r, x.where)).join('')
    : '<p class="note" style="margin:0">Try a program name (GRIP, PURM), an office (Weingarten, CAPS), or a topic (tutoring, abroad, funding).</p>';
}
q.addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 120); });
q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; runSearch(); } });
qClear.addEventListener('click', () => { q.value = ''; runSearch(); q.focus(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName) && !dlg.open) { e.preventDefault(); q.focus(); }
});
$('jumpnav').addEventListener('click', () => { if (q.value) { q.value = ''; runSearch(); } });

/* ---- highlight the section you're in ---- */
const navLinks = [...document.querySelectorAll('[data-nav]')];
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    navLinks.forEach(a => a.classList.toggle('on', a.dataset.nav === en.target.id));
    const on = navLinks.find(a => a.dataset.nav === en.target.id);
    if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });
}, { rootMargin: '-90px 0px -65% 0px' });
document.querySelectorAll('.sect[id]:not(#results)').forEach(s => spy.observe(s));

const totop = $('totop');
addEventListener('scroll', () => totop.classList.toggle('show', scrollY > 900), { passive: true });
totop.addEventListener('click', () => scrollTo({ top: 0 }));

addEventListener('hashchange', openFromHash);
openFromHash();
</script>
</body>
</html>
